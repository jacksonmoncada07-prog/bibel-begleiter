<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#94763E">
<title>Bibel-Begleiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFCF7; --chat-bg:#F6EFE2; --surface:#FFFFFF; --surface-2:#FFF6E7; --line:#E8E2D6;
  --ink:#1E293B; --ink-2:#5B6474; --brand:#94763E; --brand-ink:#FFFFFF; --brand-soft:#F3E7CF;
  --accent:#F59E0B; --ok:#1E8E3E; --me:#EADBB8; --bot:#FFFFFF; --shadow:0 1px 2px rgba(30,41,59,.08),0 4px 14px rgba(30,41,59,.06);
  --fs:16px; --scripture:"Lora",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130E; --chat-bg:#1C1812; --surface:#231E17; --surface-2:#2A241B; --line:#3A3226;
    --ink:#F2EDE4; --ink-2:#B5AC9C; --brand:#C9A869; --brand-ink:#16130E; --brand-soft:#3A3020;
    --me:#4A3D24; --bot:#2A241B; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16130E; --chat-bg:#1C1812; --surface:#231E17; --surface-2:#2A241B; --line:#3A3226;
  --ink:#F2EDE4; --ink-2:#B5AC9C; --brand:#C9A869; --brand-ink:#16130E; --brand-soft:#3A3020;
  --me:#4A3D24; --bot:#2A241B; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 var(--fs)/1.55 "Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:560px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--brand);color:var(--brand-ink);flex-shrink:0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.avatar svg{width:24px;height:24px}
.top h1{font-size:1.02rem;font-weight:700;line-height:1.2}
.top .status{font-size:.78rem;opacity:.9;font-weight:500}
.top .grow{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.14)}
.icon-btn svg{width:22px;height:22px}

/* views */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
.pad{padding:16px}

/* chat */
#v-chat{display:none;flex-direction:column;background:var(--chat-bg)}
#v-chat.on{display:flex}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font-size:.72rem;background:var(--surface);color:var(--ink-2);padding:3px 10px;border-radius:8px;box-shadow:var(--shadow);margin:4px 0}
.b{max-width:86%;padding:8px 11px 6px;border-radius:12px;box-shadow:var(--shadow);font-size:.95em;word-wrap:break-word;position:relative}
.b.bot{background:var(--bot);align-self:flex-start;border-top-left-radius:3px}
.b.me{background:var(--me);align-self:flex-end;border-top-right-radius:3px}
.b .time{display:block;text-align:right;font-size:.68rem;color:var(--ink-2);margin-top:2px}
.b p+p,.b ul+p,.b p+ul{margin-top:.55em}
.b ul{padding-left:1.15em}
.b.err{background:#FDECEC;color:#7A1F1F}
.ref{display:inline-flex;align-items:center;gap:3px;background:var(--brand-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:999px;padding:0 8px;margin:1px 1px;font-size:.86em;font-weight:600;line-height:1.6;white-space:nowrap}
.ref::before{content:"📖";font-size:.85em}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);opacity:.4;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:.9;transform:translateY(-3px)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 12px 4px;flex-shrink:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:.84em;font-weight:600;box-shadow:var(--shadow)}
.chip:hover{border-color:var(--brand)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));flex-shrink:0}
.composer textarea{flex:1;resize:none;border:0;border-radius:22px;padding:11px 16px;background:var(--surface);box-shadow:var(--shadow);max-height:130px;line-height:1.4;outline:none}
.send{width:46px;height:46px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex-shrink:0;box-shadow:var(--shadow)}
.send:disabled{opacity:.5}
.send svg{width:21px;height:21px}

/* tabs */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom);flex-shrink:0}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;font-size:.66rem;font-weight:600;color:var(--ink-2);min-width:0}
.tabs button svg{width:22px;height:22px}
.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs button.on{color:var(--brand)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.h2{font-size:1.2rem;font-weight:800;line-height:1.25;margin:4px 0 8px}
.muted{color:var(--ink-2);font-size:.9em}
.scripture{font-family:var(--scripture);font-size:1.12em;line-height:1.65}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:12px;padding:12px 16px;width:100%;margin-top:12px}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.sec-title{font-weight:800;font-size:.95rem;margin:16px 0 6px}
.votd{background:linear-gradient(160deg,var(--brand-soft),var(--surface-2));border:1px solid var(--line)}
.votd .ref-l{font-weight:700;color:var(--brand);margin-top:8px}
.dev h3{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);margin-top:14px}
.dev p{margin-top:4px}
.skeleton{height:12px;border-radius:6px;background:var(--line);margin:9px 0;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.5}}

/* bible */
.testament{font-weight:800;font-size:.85rem;color:var(--ink-2);margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.06em}
.grid-books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid-books button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;font-weight:600;font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-ch{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.grid-ch button{background:var(--surface);border:1px solid var(--line);border-radius:10px;aspect-ratio:1;font-weight:700}
.grid-books button:hover,.grid-ch button:hover{border-color:var(--brand)}
.crumbs{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.crumbs button{color:var(--brand);font-weight:700}
.reader .v{font-family:var(--scripture);font-size:1.1em;line-height:1.75;padding:2px 4px;border-radius:6px;cursor:pointer}
.reader .v sup{font-family:"Montserrat",sans-serif;font-size:.62em;font-weight:700;color:var(--brand);margin-right:4px}
.reader .v.sel{background:var(--brand-soft);text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:4px}
.chnav{display:flex;justify-content:space-between;gap:10px;margin:18px 0 90px}
.chnav button{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px;font-weight:700;background:var(--surface)}
.selbar{position:absolute;left:12px;right:12px;bottom:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px;display:none;gap:6px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:5}
.selbar.on{display:flex}
.selbar button{flex:1;padding:9px 4px;border-radius:10px;font-weight:700;font-size:.82em}
.selbar button:first-child{background:var(--brand);color:var(--brand-ink)}

/* faq */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;outline:none}
.search:focus{border-color:var(--brand)}
details.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
details.cat summary{list-style:none;padding:13px 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary .n{color:var(--ink-2);font-weight:600;font-size:.85em}
.qlist button{display:block;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line);font-size:.92em}
.qlist button:hover{background:var(--surface-2)}
.qlist .num{color:var(--brand);font-weight:700;margin-right:6px}
.panel{position:absolute;inset:0;background:var(--bg);overflow-y:auto;display:none;z-index:4}
.panel.on{display:block}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;margin-bottom:12px}
.answer p+p,.answer ul+p,.answer p+ul{margin-top:.6em}.answer ul{padding-left:1.2em}

/* study */
.row{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:8px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
select,.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;outline:none}
label.l{font-size:.75rem;font-weight:700;color:var(--ink-2);display:block;margin-bottom:3px}
.q7{display:flex;gap:12px}
.q7 .nr{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.q7 h4{font-size:1rem;line-height:1.3}
.q7 textarea{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;min-height:74px;resize:vertical;outline:none}
.q7 .mini{margin-top:8px;color:var(--brand);font-weight:700;font-size:.85em}
.passage{max-height:300px;overflow-y:auto;margin-top:10px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,12,8,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:85dvh;overflow-y:auto}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.seg{display:flex;gap:8px;margin-top:6px}
.seg button{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700;background:var(--surface)}
.seg button.on{border-color:var(--brand);background:var(--brand-soft)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.85em;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.loader{display:grid;place-items:center;padding:40px;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <main>
    <section class="view on" id="v-chat">
      <div class="msgs" id="msgs"></div>

        <textarea id="input" rows="1" maxlength="2000"></textarea>

      </form>
    </section>
    <section class="view" id="v-today"><div class="pad" id="today"></div></section>
    <section class="view" id="v-bible"><div class="pad" id="bible"></div></section>
    <section class="view" id="v-faq"><div class="pad" id="faq"></div></section>
    <section class="view" id="v-study"><div class="pad" id="study"></div></section>
    <div class="panel" id="faqPanel"><div class="pad" id="faqAnswer"></div></div>
    <div class="selbar" id="selbar"></div>
  </main>

  <nav class="tabs" id="tabs">
    <button data-tab="chat" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5Z"/></svg><span data-t="tabChat"></span></button>
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-t="tabToday"></span></button>
    <button data-tab="bible"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span data-t="tabBible"></span></button>
    <button data-tab="faq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span data-t="tabFaq"></span></button>
    <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span data-t="tabStudy"></span></button>
  </nav>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

/* ---------- utilidades ---------- */
var $ = function(id){return document.getElementById(id)};
var store = {
  get:function(k,d){try{var v=localStorage.getItem("bb_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem("bb_"+k,JSON.stringify(v))}catch(e){}},

function t(k){var L=T[S.lang]||T.en;return L[k]!=null?L[k]:(T.en[k]!=null?T.en[k]:k)}
function fmt(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]!=null?o[k]:""})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(msg){var el=$("toast");el.textContent=msg;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove("on")},1600)}
function nowTime(){var d=new Date();return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function copyText(s){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast(t("copied"))},fallback)}else fallback();
  function fallback(){var ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(t("copied"))}catch(e){}ta.remove()}
}

/* ---------- idioma ---------- */
function fetchTimeout(url,ms){return new Promise(function(res,rej){var tm=setTimeout(function(){rej(new Error("timeout"))},ms);fetch(url).then(function(r){clearTimeout(tm);res(r)},function(e){clearTimeout(tm);rej(e)})})}
function langFromBrowser(){var ls=navigator.languages||[navigator.language||""];for(var i=0;i<ls.length;i++){var l=(ls[i]||"").slice(0,2).toLowerCase();if(LANGS.indexOf(l)>=0)return l}return null}
function detectLang(){
  var q=new URLSearchParams(location.search).get("lang");
  if(q&&LANGS.indexOf(q)>=0)return Promise.resolve({lang:q,auto:false});
  var saved=store.get("lang",null);
  if(saved&&LANGS.indexOf(saved)>=0)return Promise.resolve({lang:saved,auto:false});
  var cached=store.get("ipLang",null);
  if(cached)return Promise.resolve({lang:cached,auto:true});
  function fromCountry(cc){cc=(cc||"").toUpperCase();return COUNTRY_LANG[cc]||(cc?"en":null)}
  return fetchTimeout("https://ipapi.co/country/",2500).then(function(r){return r.ok?r.text():""})
    .catch(function(){return fetchTimeout("https://get.geojs.io/v1/ip/country",2500).then(function(r){return r.ok?r.text():""})})
    .catch(function(){return ""})
    .then(function(cc){var l=fromCountry(String(cc).trim().slice(0,2))||langFromBrowser()||CONFIG.DEFAULT_LANG;store.set("ipLang",l);return{lang:l,auto:true}});
}
function setLang(l,manual){
  S.lang=l;document.documentElement.lang=l;
  if(manual){S.autoLang=false;store.set("lang",l)}
  S.msgs=store.get("chat_"+l,[]);
  document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t(el.getAttribute("data-t"))});
  $("input").placeholder=t("placeholder");
  document.title=t("appName");
  S.reader={b:null,c:null,sel:[]};S.study=null;S.studyPick=null;S.chatContext="";
  renderHeader();renderChat();renderChips();
  loadBible(l).then(function(){renderChat();renderAll()});
  renderAll();
}

/* ---------- Biblia ---------- */
function loadBible(l){
  if(S.bibles[l]){S.bible=S.bibles[l];return Promise.resolve(S.bible)}
  S.bible=null;
  return fetch(CONFIG.BIBLE_BASE+l+".json").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(d){S.bibles[l]=d;if(S.lang===l)S.bible=d;return d})
    .catch(function(e){console.warn("Bible load failed",e);return null});
}
function bookName(b){return S.bible&&S.bible.books[b-1]?S.bible.books[b-1].n:("#"+b)}
function parseRef(s){var m=String(s).match(/^(\d{1,2}):(\d{1,3})(?::(\d{1,3})(?:-(\d{1,3}))?)?$/);if(!m)return null;var r={b:+m[1],c:+m[2],v1:m[3]?+m[3]:null,v2:m[4]?+m[4]:(m[3]?+m[3]:null)};if(r.b<1||r.b>66)return null;return r}
function refKey(r){return r.b+":"+r.c+(r.v1?":"+r.v1+(r.v2&&r.v2!==r.v1?"-"+r.v2:""):"")}
function refLabel(r){var sep=S.lang==="de"?",":":";return bookName(r.b)+" "+r.c+(r.v1?sep+r.v1+(r.v2&&r.v2!==r.v1?"–"+r.v2:""):"")}
function chapterVerses(b,c){if(!S.bible)return null;var bk=S.bible.books[b-1];return bk&&bk.c[c-1]?bk.c[c-1]:null}
function refVerses(r){var ch=chapterVerses(r.b,r.c);if(!ch)return [];var a=r.v1||1,z=r.v2||ch.length;var out=[];for(var i=a;i<=Math.min(z,ch.length);i++)out.push({n:i,t:ch[i-1]});return out}
function refPlain(r){return refVerses(r).map(function(v){return v.n+" "+v.t}).join(" ")}

/* ---------- texto enriquecido ---------- */
function rich(text){
  var h=esc(text||"");
  h=h.replace(/\[\[(\d{1,2}:\d{1,3}(?::\d{1,3}(?:-\d{1,3})?)?)\]\]/g,function(_,k){var r=parseRef(k);return r?'<button class="ref" data-ref="'+refKey(r)+'">'+esc(refLabel(r))+'</button>':""});
  h=h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  var blocks=h.split(/\n{2,}/),out="";
  blocks.forEach(function(bl){
    var lines=bl.split("\n");
    if(lines.every(function(l){return /^\s*([-•*]|\d+\.)\s+/.test(l)||!l.trim()})){
      out+="<ul>"+lines.filter(function(l){return l.trim()}).map(function(l){return"<li>"+l.replace(/^\s*([-•*]|\d+\.)\s+/,"")+"</li>"}).join("")+"</ul>";
    }else{
      var buf=[],list=[];
      lines.forEach(function(l){if(/^\s*[-•*]\s+/.test(l)){list.push(l.replace(/^\s*[-•*]\s+/,""))}else{if(list.length){buf.push("<ul><li>"+list.join("</li><li>")+"</li></ul>");list=[]}buf.push(l)}});
      if(list.length)buf.push("<ul><li>"+list.join("</li><li>")+"</li></ul>");
      out+="<p>"+buf.join("<br>").replace(/<br><ul>/g,"<ul>").replace(/<\/ul><br>/g,"</ul>")+"</p>";
    }
  });
  return out;
}

/* ---------- API ---------- */
function api(body){
  if(!CONFIG.API_URL)return Promise.reject(new Error("cfg"));
  var h={"Content-Type":"application/json"};
  if(CONFIG.API_KEY){h.Authorization="Bearer "+CONFIG.API_KEY;h.apikey=CONFIG.API_KEY}
  body.lang=S.lang;
  return fetch(CONFIG.API_URL,{method:"POST",headers:h,body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){if(!r.ok||j.error)throw new Error(j.error||r.status);return j})});
}
function errText(e){return e&&e.message==="cfg"?t("errCfg"):t("errNet")}

/* ---------- cabecera y pestañas ---------- */
function renderHeader(){
  var titles={chat:t("appName"),today:t("verseOfDay"),bible:t("tabBible"),faq:t("tabFaq"),study:t("tabStudy")};
  $("hTitle").textContent=titles[S.tab];
  $("hStatus").textContent=S.tab==="chat"?(S.busy?t("typing"):t("online")):t("appName");
  $("btnNew").style.display=S.tab==="chat"?"":"none";
}
function go(tab){
  S.tab=tab;
  document.querySelectorAll(".view").forEach(function(v){v.classList.toggle("on",v.id==="v-"+tab)});
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-tab")===tab)});
  renderHeader();
  if(tab!=="faq")$("faqPanel").classList.remove("on");
  if(tab==="bible")updateSelbar();else $("selbar").classList.remove("on");
  if(tab==="today")renderToday();
  if(tab==="chat")scrollChat();
}
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button[data-tab]");if(b)go(b.getAttribute("data-tab"))});

/* ---------- chat ---------- */
function renderChat(){
  var html='<div class="day">'+esc(new Date().toLocaleDateString(S.lang,{weekday:"long",day:"numeric",month:"long"}))+'</div>';
  html+='<div class="b bot">'+rich(t("welcome"))+'<span class="time">'+nowTime()+'</span></div>';
  S.msgs.forEach(function(m){html+='<div class="b '+(m.role==="user"?"me":"bot")+(m.err?" err":"")+'">'+(m.role==="user"?"<p>"+esc(m.content).replace(/\n/g,"<br>")+"</p>":rich(m.content))+'<span class="time">'+esc(m.time||"")+'</span></div>'});
  if(S.busy)html+='<div class="b bot"><span class="typing"><i></i><i></i><i></i></span></div>';
  $("msgs").innerHTML=html;scrollChat();
}
function scrollChat(){var m=$("msgs");requestAnimationFrame(function(){m.scrollTop=m.scrollHeight})}
function renderChips(){
  var show=S.msgs.length<2;
  $("chips").style.display=show?"":"none";
  $("chips").innerHTML=t("suggestions").map(function(s){return'<button class="chip" type="button">'+esc(s)+'</button>'}).join("");
}
function saveChat(){store.set("chat_"+S.lang,S.msgs.filter(function(m){return!m.err}).slice(-60))}
function send(text,context){
  text=(text||"").trim();if(!text||S.busy)return;
  if(S.tab!=="chat")go("chat");
  if(context)S.chatContext=context;
  S.msgs.push({role:"user",content:text,time:nowTime()});
  S.busy=true;renderChat();renderChips();renderHeader();saveChat();
  var hist=S.msgs.filter(function(m){return!m.err}).map(function(m){return{role:m.role,content:m.content}});
  api({mode:"chat",messages:hist,context:context||S.chatContext||""}).then(function(j){
    S.msgs.push({role:"assistant",content:j.reply,time:nowTime()});
  }).catch(function(e){S.msgs.push({role:"assistant",content:errText(e),err:true,time:nowTime()})})
  .then(function(){S.busy=false;saveChat();renderChat();renderHeader()});
}
$("composer").addEventListener("submit",function(e){e.preventDefault();var v=$("input").value;$("input").value="";autoGrow();send(v)});
$("input").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&window.matchMedia("(pointer:fine)").matches){e.preventDefault();$("composer").requestSubmit()}});
function autoGrow(){var i=$("input");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,130)+"px"}
$("input").addEventListener("input",autoGrow);
$("chips").addEventListener("click",function(e){var c=e.target.closest(".chip");if(c)send(c.textContent)});
$("btnNew").addEventListener("click",function(){if(!S.msgs.length||confirm(t("newChatConfirm"))){S.msgs=[];S.chatContext="";saveChat();renderChat();renderChips()}});

function openSheet(html){$("sheet").innerHTML='<div class="grab"></div>'+html;$("modal").classList.add("on")}
function closeSheet(){$("modal").classList.remove("on")}
$("modal").addEventListener("click",function(e){if(e.target.id==="modal"||e.target.closest("[data-close]"))closeSheet()});
document.addEventListener("click",function(e){
  var b=e.target.closest(".ref");if(!b)return;
  var r=parseRef(b.getAttribute("data-ref"));if(!r)return;
  var vv=refVerses(r);
  var body=vv.length?vv.map(function(v){return'<span><sup class="muted">'+v.n+'</sup> '+esc(v.t)+'</span>'}).join(" "):'<span class="muted">'+t("loading")+'</span>';
  openSheet('<div class="kicker">'+esc(S.bible?S.bible.name:"")+'</div><div class="h2">'+esc(refLabel(r))+'</div><div class="scripture">'+body+'</div>'+
    '<button class="btn" data-goread="'+r.b+':'+r.c+'">'+t("readChapter")+'</button><button class="btn ghost" data-close>'+t("close")+'</button>');
});
$("sheet").addEventListener("click",function(e){var g=e.target.closest("[data-goread]");if(!g)return;var p=g.getAttribute("data-goread").split(":");closeSheet();S.reader={b:+p[0],c:+p[1],sel:[]};go("bible");renderBible()});

/* ---------- Hoy ---------- */
function dayIndex(){var d=new Date(),s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/864e5)}
function renderToday(){
  var el=$("today");
  var r=parseRef(VOTD[dayIndex()%VOTD.length]);
  if(!S.bible){el.innerHTML='<div class="loader">'+t("loading")+'</div>';return}
  var txt=refVerses(r).map(function(v){return v.t}).join(" ");
  var html='<div class="card votd"><div class="kicker">'+t("verseOfDay")+' · '+esc(new Date().toLocaleDateString(S.lang,{day:"numeric",month:"long"}))+'</div>'+
    '<p class="scripture" style="margin-top:10px">„'+esc(txt)+'“</p><div class="ref-l">'+esc(refLabel(r))+'</div>'+
    '<div class="row3"><button class="btn ghost" id="copyVotd" style="margin-top:12px">'+t("copy")+'</button><button class="btn ghost" data-goread="'+r.b+':'+r.c+'" id="readVotd" style="margin-top:12px">'+t("chapter")+'</button></div></div>';
  html+='<div class="card dev" id="devCard"><div class="kicker">'+t("devotional")+'</div><div id="devBody"><p class="muted" style="margin-top:6px">'+t("preparing")+'</p><div class="skeleton"></div><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:60%"></div></div></div>';
  el.innerHTML=html;
  $("copyVotd").onclick=function(){copyText("„"+txt+"“ – "+refLabel(r))};
  $("readVotd").onclick=function(){S.reader={b:r.b,c:r.c,sel:r.v1?range(r.v1,r.v2):[]};go("bible");renderBible()};
  var key="dev_"+today()+"_"+S.lang,cached=store.get(key,null);
  if(cached)return showDev(cached,r,txt);
  api({mode:"devotional",ref:refLabel(r),text:txt}).then(function(j){store.set(key,j.devotional);if(S.tab==="today")showDev(j.devotional,r,txt)})
    .catch(function(e){var b=$("devBody");if(b)b.innerHTML='<p class="muted" style="margin-top:6px">'+esc(errText(e))+'</p>'});
}
function showDev(d,r,txt){
  var b=$("devBody");if(!b)return;
  b.innerHTML='<div class="h2">'+esc(d.title||"")+'</div><div>'+rich(d.reflection||"")+'</div>'+
    '<h3>✍️ '+t("exercise")+'</h3><div>'+rich(d.exercise||"")+'</div>'+
    '<h3>💭 '+t("question")+'</h3><div>'+rich(d.question||"")+'</div>'+
    '<h3>🙏 '+t("prayer")+'</h3><div><p style="font-style:italic">'+esc(d.prayer||"")+'</p></div>'+
    '<button class="btn" id="talkDev">'+t("talkAbout")+'</button>';
  $("talkDev").onclick=function(){send(fmt(t("talkMsg"),{ref:refLabel(r)}),refLabel(r)+": "+txt)};
}
function range(a,z){var o=[];for(var i=a;i<=(z||a);i++)o.push(i);return o}

/* ---------- Biblia (lector) ---------- */
function renderBible(){
  var el=$("bible"),R=S.reader;$("selbar").classList.remove("on");
  if(!S.bible){el.innerHTML='<div class="loader">'+t("loading")+'</div>';return}
  if(!R.b){
    var h="";
    [[1,39,t("ot")],[40,66,t("nt")]].forEach(function(g){
      h+='<div class="testament">'+g[2]+'</div><div class="grid-books">';
      for(var i=g[0];i<=g[1];i++)h+='<button data-book="'+i+'">'+esc(bookName(i))+'</button>';
      h+='</div>';
    });
    el.innerHTML='<div class="muted">'+esc(S.bible.name)+'</div>'+h;return;
  }
  var bk=S.bible.books[R.b-1];
  if(!R.c){
    var g='';for(var c=1;c<=bk.c.length;c++)g+='<button data-ch="'+c+'">'+c+'</button>';
    el.innerHTML='<div class="crumbs"><button data-home>'+t("books")+'</button> › <strong>'+esc(bk.n)+'</strong></div><div class="grid-ch">'+g+'</div>';return;
  }
  var vs=bk.c[R.c-1]||[];
  var v=vs.map(function(x,i){return'<span class="v'+(R.sel.indexOf(i+1)>=0?" sel":"")+'" data-v="'+(i+1)+'"><sup>'+(i+1)+'</sup>'+esc(x)+'</span> '}).join("");
  el.innerHTML='<div class="crumbs"><button data-home>'+t("books")+'</button> › <button data-bookonly>'+esc(bk.n)+'</button> › <strong>'+t("chapter")+' '+R.c+'</strong></div>'+
    '<p class="muted" style="margin-bottom:10px">'+t("tapVerse")+'</p><div class="reader">'+v+'</div>'+
    '<div class="chnav"><button data-prev '+(R.b===1&&R.c===1?"disabled":"")+'>'+t("prev")+'</button><button data-next '+(R.b===66&&R.c===bk.c.length?"disabled":"")+'>'+t("next")+'</button></div>';
  updateSelbar();
  if(R.sel.length){var first=el.querySelector('.v[data-v="'+R.sel[0]+'"]');if(first)setTimeout(function(){first.scrollIntoView({block:"center"})},30)}else $("v-bible").scrollTop=0;
}
function selRef(){var R=S.reader,s=R.sel.slice().sort(function(a,b){return a-b});return s.length?{b:R.b,c:R.c,v1:s[0],v2:s[s.length-1]}:{b:R.b,c:R.c,v1:null,v2:null}}
function updateSelbar(){
  var bar=$("selbar");if(!S.reader.sel.length){bar.classList.remove("on");return}
  bar.innerHTML='<button data-act="ask">'+t("askVerse")+'</button><button data-act="copy">'+t("copy")+'</button><button data-act="study">'+t("study7")+'</button>';
  bar.classList.add("on");
}
$("bible").addEventListener("click",function(e){
  var R=S.reader,x;
  if(x=e.target.closest("[data-book]")){S.reader={b:+x.getAttribute("data-book"),c:null,sel:[]};renderBible();$("v-bible").scrollTop=0;return}
  if(x=e.target.closest("[data-ch]")){R.c=+x.getAttribute("data-ch");R.sel=[];renderBible();return}
  if(e.target.closest("[data-home]")){S.reader={b:null,c:null,sel:[]};renderBible();return}
  if(e.target.closest("[data-bookonly]")){R.c=null;R.sel=[];renderBible();return}
  if(e.target.closest("[data-prev]")){if(R.c>1)R.c--;else if(R.b>1){R.b--;R.c=S.bible.books[R.b-1].c.length}R.sel=[];renderBible();return}
  if(e.target.closest("[data-next]")){if(R.c<S.bible.books[R.b-1].c.length)R.c++;else if(R.b<66){R.b++;R.c=1}R.sel=[];renderBible();return}
  if(x=e.target.closest(".v")){var n=+x.getAttribute("data-v"),i=R.sel.indexOf(n);if(i>=0)R.sel.splice(i,1);else R.sel.push(n);x.classList.toggle("sel");updateSelbar()}
});
$("selbar").addEventListener("click",function(e){
  var a=e.target.closest("[data-act]");if(!a)return;var r=selRef(),txt=refPlain(r);
  if(a.getAttribute("data-act")==="ask")send(fmt(t("explain"),{ref:refLabel(r)}),refLabel(r)+": "+txt);
  if(a.getAttribute("data-act")==="copy")copyText(txt+" – "+refLabel(r));
  if(a.getAttribute("data-act")==="study"){S.study=r;go("study");renderStudy()}
});

/* ---------- 150 preguntas ---------- */
function faqText(ci,qi){
  if(S.lang==="de")return FAQ[ci][qi][0];
  if(S.lang==="en")return FAQ[ci][qi][1];
  var tr=S.faqQ[S.lang]||store.get("faqq_"+S.lang,null);
  if(tr){S.faqQ[S.lang]=tr;var n=ci*15+qi;if(tr[n])return tr[n]}
  return FAQ[ci][qi][1];
}
function ensureFaqTranslation(){
  var failed=ensureFaqTranslation.failed||(ensureFaqTranslation.failed={});
  if(S.lang==="de"||S.lang==="en"||S.faqQ[S.lang]||store.get("faqq_"+S.lang,null)||ensureFaqTranslation.busy||failed[S.lang])return false;
  ensureFaqTranslation.busy=true;var lang=S.lang;
  var items=[];FAQ.forEach(function(c){c.forEach(function(q){items.push(q[1])})});
  // un solo intento por sesión: si falla, quedan las preguntas en inglés (las respuestas igual salen en el idioma elegido)
  api({mode:"translate",items:items}).then(function(j){if(j.items&&j.items.length===items.length){store.set("faqq_"+lang,j.items);S.faqQ[lang]=j.items}else failed[lang]=true})
    .catch(function(){failed[lang]=true}).then(function(){ensureFaqTranslation.busy=false;if(S.lang===lang)setTimeout(function(){renderFaq($("faqSearch")?$("faqSearch").value:"")},0)});
  return true;
}
function renderFaq(filter){
  var el=$("faq");filter=(filter||"").toLowerCase().trim();
  var translating=ensureFaqTranslation()||ensureFaqTranslation.busy;
  if(!el.querySelector(".search")){
    el.innerHTML='<div class="kicker">'+t("tabFaq")+'</div><div class="h2">'+t("faqTitle")+'</div><p class="muted">'+t("faqIntro")+'</p>'+
      '<input class="search" id="faqSearch" type="search" style="margin-top:12px"><div id="faqNote"></div><div id="faqList"></div>';
    $("faqSearch").addEventListener("input",function(){renderFaq(this.value)});
  }
  $("faqSearch").placeholder=t("faqSearch");
  $("faqNote").innerHTML=translating?'<p class="muted" style="margin-top:8px">⏳ '+t("translating")+'</p>':"";
  var h="",found=0,num=0;
  FAQ.forEach(function(cat,ci){
    var items="",cnt=0;
    cat.forEach(function(q,qi){num=ci*15+qi+1;var txt=faqText(ci,qi);if(filter&&txt.toLowerCase().indexOf(filter)<0)return;cnt++;items+='<button data-q="'+ci+'-'+qi+'"><span class="num">'+num+'.</span>'+esc(txt)+'</button>'});
    if(!cnt)return;found+=cnt;
    h+='<details class="cat"'+(filter?" open":"")+'><summary><span>'+esc(t("cats")[ci])+'</span><span class="n">'+cnt+'</span></summary><div class="qlist">'+items+'</div></details>';
  });
  $("faqList").innerHTML=found?h:'<p class="muted" style="margin-top:14px">'+t("faqNone")+'</p>';
}
$("faq").addEventListener("click",function(e){var b=e.target.closest("[data-q]");if(!b)return;var p=b.getAttribute("data-q").split("-");openFaq(+p[0],+p[1])});
function openFaq(ci,qi){
  var q=faqText(ci,qi),key="faqa_"+S.lang+"_"+ci+"_"+qi,cached=store.get(key,null);
  var panel=$("faqPanel"),box=$("faqAnswer");panel.classList.add("on");panel.scrollTop=0;
  function paint(ans,err){
    box.innerHTML='<button class="back" data-back>‹ '+t("back")+'</button><div class="kicker">'+esc(t("cats")[ci])+' · '+(ci*15+qi+1)+'/150</div><div class="h2">'+esc(q)+'</div>'+
      '<div class="card answer">'+(ans?rich(ans):(err?'<p class="muted">'+esc(err)+'</p>':'<span class="typing"><i></i><i></i><i></i></span>'))+'</div>'+
      (ans?'<button class="btn" data-cont>'+t("continueChat")+'</button>':"");
  }
  paint(cached);
  if(!cached)api({mode:"chat",messages:[{role:"user",content:q}]}).then(function(j){store.set(key,j.reply);paint(j.reply)}).catch(function(e){paint(null,errText(e))});
  box.onclick=function(e){
    if(e.target.closest("[data-back]"))panel.classList.remove("on");
    if(e.target.closest("[data-cont]")){var a=store.get(key,"");S.msgs.push({role:"user",content:q,time:nowTime()},{role:"assistant",content:a,time:nowTime()});saveChat();panel.classList.remove("on");go("chat");renderChat();renderChips()}
  };
}

/* ---------- 7 preguntas ---------- */
function renderStudy(){
  var el=$("study");
  if(!S.bible){el.innerHTML='<div class="loader">'+t("loading")+'</div>';return}
  var r=S.study||S.studyPick||{b:43,c:3,v1:1,v2:21};
  var bk=S.bible.books[r.b-1],nv=bk.c[r.c-1].length;
  var bopts="";for(var i=1;i<=66;i++)bopts+='<option value="'+i+'"'+(i===r.b?" selected":"")+'>'+esc(bookName(i))+'</option>';
  var copts="";for(var c=1;c<=bk.c.length;c++)copts+='<option'+(c===r.c?" selected":"")+'>'+c+'</option>';
  function vopts(sel){var o="";for(var v=1;v<=nv;v++)o+='<option'+(v===sel?" selected":"")+'>'+v+'</option>';return o}
  var h='<div class="kicker">'+t("tabStudy")+'</div><div class="h2">'+t("studyTitle")+'</div><p class="muted">'+t("studyIntro")+'</p>'+
    '<div class="card" style="margin-top:14px"><div class="row"><div><label class="l">'+t("book")+'</label><select id="sB">'+bopts+'</select></div><div><label class="l">'+t("chapter")+'</label><select id="sC">'+copts+'</select></div></div>'+
    '<div class="row3"><div><label class="l">'+t("fromV")+'</label><select id="sV1">'+vopts(r.v1||1)+'</select></div><div><label class="l">'+t("toV")+'</label><select id="sV2">'+vopts(r.v2||nv)+'</select></div></div>'+
    '<button class="btn" id="sOpen">'+t("open")+'</button></div>';
  if(S.study){
    var ref=refLabel(r),notes=store.get("notes_"+refKey(r),{});
    h+='<div class="card" style="margin-top:14px"><div class="kicker">'+esc(S.bible.name)+'</div><div class="h2">'+esc(ref)+'</div><div class="passage scripture">'+refVerses(r).map(function(v){return'<sup class="muted">'+v.n+'</sup> '+esc(v.t)}).join(" ")+'</div></div>';
    t("q7").forEach(function(q,i){
      h+='<div class="card"><div class="q7"><div class="nr">'+(i+1)+'</div><div style="flex:1;min-width:0"><h4>'+esc(q[0])+'</h4><p class="muted">'+esc(q[1])+'</p>'+
        '<textarea data-note="'+i+'" placeholder="'+esc(t("notes"))+'">'+esc(notes[i]||"")+'</textarea><button class="mini" data-help="'+i+'">💬 '+t("help")+'</button></div></div></div>';
    });
    h+='<div style="height:20px"></div>';
  }
  el.innerHTML=h;
  // cambiar libro o capítulo solo actualiza el selector; el pasaje se abre con el botón
  $("sB").onchange=function(){var b=+this.value;S.study=null;S.studyPick={b:b,c:1,v1:1,v2:S.bible.books[b-1].c[0].length};renderStudy()};
  $("sC").onchange=function(){var b=+$("sB").value,c=+this.value;S.study=null;S.studyPick={b:b,c:c,v1:1,v2:S.bible.books[b-1].c[c-1].length};renderStudy()};
  $("sOpen").onclick=function(){var b=+$("sB").value,c=+$("sC").value,a=+$("sV1").value,z=+$("sV2").value;if(z<a){var tmp=a;a=z;z=tmp}S.study={b:b,c:c,v1:a,v2:z};S.studyPick=S.study;renderStudy()};
}
$("study").addEventListener("input",function(e){var ta=e.target.closest("[data-note]");if(!ta||!S.study)return;var k="notes_"+refKey(S.study),n=store.get(k,{});n[ta.getAttribute("data-note")]=ta.value;store.set(k,n)});
$("study").addEventListener("click",function(e){var b=e.target.closest("[data-help]");if(!b||!S.study)return;var i=+b.getAttribute("data-help"),q=t("q7")[i],r=S.study;
  send(fmt(t("helpMsg"),{n:i+1,q:q[0],ref:refLabel(r)}),refLabel(r)+": "+refPlain(r))});

/* ---------- ajustes ---------- */
function openSettings(){
  var fs=store.get("fs","m");
  var opts=LANGS.map(function(l){return'<option value="'+l+'"'+(l===S.lang?" selected":"")+'>'+LANG_NAMES[l]+'</option>'}).join("");
  openSheet('<div class="h2">'+t("settings")+'</div>'+
    '<label class="l" style="margin-top:12px">'+t("language")+'</label><select id="setLang">'+opts+'</select>'+(S.autoLang?'<p class="muted" style="margin-top:6px">🌍 '+t("autoLang")+'</p>':"")+
    '<label class="l" style="margin-top:16px">'+t("textSize")+'</label><div class="seg" id="setFs"><button data-fs="s" class="'+(fs==="s"?"on":"")+'" style="font-size:14px">A</button><button data-fs="m" class="'+(fs==="m"?"on":"")+'" style="font-size:17px">A</button><button data-fs="l" class="'+(fs==="l"?"on":"")+'" style="font-size:20px">A</button></div>'+
    '<label class="l" style="margin-top:16px">'+t("translationL")+'</label><p>'+esc(S.bible?S.bible.name:"—")+'</p>'+
    '<button class="btn ghost" id="setReset" style="margin-top:20px">'+t("reset")+'</button><button class="btn" data-close>'+t("close")+'</button>');
  $("setLang").onchange=function(){closeSheet();setLang(this.value,true)};
  $("setFs").onclick=function(e){var b=e.target.closest("[data-fs]");if(!b)return;applyFs(b.getAttribute("data-fs"));store.set("fs",b.getAttribute("data-fs"));this.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b)})};
  $("setReset").onclick=function(){if(confirm(t("resetConfirm"))){store.clear();location.reload()}};
}
function applyFs(k){document.documentElement.style.setProperty("--fs",{s:"15px",m:"16px",l:"18.5px"}[k]||"16px")}
$("btnSettings").addEventListener("click",openSettings);

function renderAll(){renderHeader();if(S.tab==="today")renderToday();renderBible();renderFaq($("faqSearch")?$("faqSearch").value:"");renderStudy()}

/* ---------- arranque ---------- */
applyFs(store.get("fs","m"));
detectLang().then(function(d){
  S.autoLang=d.auto;setLang(d.lang,false);
  // enlaces directos: index.html#today · #bible · #faq · #study (sirve para los mails de entrega)
  var h=(location.hash||"").replace("#","");if(["chat","today","bible","faq","study"].indexOf(h)>=0)go(h);
});
</script>
